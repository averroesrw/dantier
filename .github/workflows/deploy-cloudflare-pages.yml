name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Cloudflare token check
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::Missing CLOUDFLARE_API_TOKEN repository secret."
          echo "::warning::Set it in GitHub to enable automatic D1 migration and Pages deploy."

      - name: Apply D1 migration
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8bf9f35c1d1b6b09cf839af068469d67
          command: d1 execute dantier-reservations --remote --file=./migrations/0001_init.sql --yes

      - name: Deploy to Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8bf9f35c1d1b6b09cf839af068469d67
          command: pages deploy dist --project-name dantier --branch main
