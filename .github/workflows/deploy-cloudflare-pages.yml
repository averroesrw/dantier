name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Resolve Cloudflare token availability
        id: cf_token
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing CLOUDFLARE_API_TOKEN repository secret."
            echo "::warning::Set it in GitHub to enable automatic D1 migration and Pages deploy."
          fi

      - name: Apply D1 migration
        if: ${{ steps.cf_token.outputs.available == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8bf9f35c1d1b6b09cf839af068469d67
          command: d1 execute dantier-reservations --remote --file=./migrations/0001_init.sql --yes

      - name: Deploy to Pages
        if: ${{ steps.cf_token.outputs.available == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8bf9f35c1d1b6b09cf839af068469d67
          command: pages deploy dist --project-name dantier --branch main
